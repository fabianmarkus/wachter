<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>usa — fabianwachter</title>

  <style>
    * {
      box-sizing: border-box;
      cursor: default !important;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px clamp(16px, 3vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111111;
      font-family: "Avenir Medium", Avenir, "Avenir Next", sans-serif;
      font-weight: 500;
    }

    .container {
      width: 100%;
    }

    .bilder {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .bilder::-webkit-scrollbar {
      display: none;
    }

    .bild {
      position: relative;
      flex: 0 0 auto;
      padding-top: calc(1.2em + 10px);
    }

    .bild-info {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: flex-start;
      align-items: baseline;
      gap: 0.3em;
      font-size: 16px;
      line-height: 1.2;
      visibility: hidden;
      pointer-events: none;
    }

    .bild-info-titel {
      text-align: left;
    }

    @media (hover: hover) {
      .bild img:hover + .bild-info {
        visibility: visible;
      }
    }

    .bilder img {
      display: block;
      flex: 0 0 auto;
      width: auto;
      height: 500px;
      object-fit: contain;
    }

    .titelzeile {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 14px;
    }

    .projekttitel {
      margin: 0;
      font-size: 32px;
    }

    .zurueck {
      font-size: 16px;
      color: inherit;
      text-decoration: none;
    }

    .zurueck:hover {
      color: inherit;
      text-decoration: none;
    }

    .bild-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      flex-direction: column;
      gap: 20px;
      padding: 24px clamp(16px, 3vw, 40px);
      background: rgba(0, 0, 0, 0.92);
      color: #ffffff;
    }

    .bild-overlay.aktiv {
      display: flex;
    }

    .bild-overlay-kopfzeile {
      display: flex;
      flex: 0 0 auto;
      align-self: center;
      width: var(--overlay-bildbreite, 100%);
      justify-content: space-between;
      align-items: baseline;
      gap: 24px;
    }

    .bild-overlay-zaehler,
    .bild-overlay-werktitel {
      margin: 0;
      font-size: 16px;
    }

    .bild-overlay-werktitel {
      text-align: right;
    }

    .bild-overlay-bildbereich {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      justify-content: center;
      min-height: 0;
      touch-action: pan-y;
    }

    .bild-overlay-bildbereich img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .bild-overlay-fusszeile {
      display: flex;
      flex: 0 0 auto;
      align-self: center;
      width: var(--overlay-bildbreite, 100%);
      justify-content: space-between;
      align-items: baseline;
      gap: 24px;
    }

    .bild-overlay-projekttitel {
      margin: 0;
      font-size: 32px;
    }

    .bild-overlay-schliessen {
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      font-size: 16px;
      cursor: pointer !important;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="bilder">
      <img src="./images/usa-01.jpg" alt="Usa 1">
      <img src="./images/usa-02.jpg" alt="Usa 2">
      <img src="./images/usa-03.jpg" alt="Usa 3">
      <img src="./images/usa-04.jpg" alt="Usa 4">
      <img src="./images/usa-05.jpg" alt="Usa 5">
      <img src="./images/usa-06.jpg" alt="Usa 6">
      <img src="./images/usa-07.jpg" alt="Usa 7">
      <img src="./images/usa-08.jpg" alt="Usa 8">
      <img src="./images/usa-09.jpg" alt="Usa 9">
      <img src="./images/usa-10.jpg" alt="Usa 10">
      <img src="./images/usa-11.jpg" alt="Usa 11">
      <img src="./images/usa-12.jpg" alt="Usa 12">
      <img src="./images/usa-13.jpg" alt="Usa 13">
      <img src="./images/usa-14.jpg" alt="Usa 14">
      <img src="./images/usa-15.jpg" alt="Usa 15">
      <img src="./images/usa-16.jpg" alt="Usa 16">
      <img src="./images/usa-17.jpg" alt="Usa 17">
      <img src="./images/usa-18.jpg" alt="Usa 18">
      <img src="./images/usa-19.jpg" alt="Usa 19">
      <img src="./images/usa-20.jpg" alt="Usa 20">
      <img src="./images/usa-21.jpg" alt="Usa 21">
    </div>

    <div class="titelzeile">
      <p class="projekttitel">usa</p>
      <a class="zurueck" href="./projects.html">back</a>
    </div>

  </main>

  <div class="bild-overlay" id="bildOverlay" aria-hidden="true">

    <div class="bild-overlay-kopfzeile">
      <p class="bild-overlay-zaehler" id="bildOverlayZaehler"></p>
      <p class="bild-overlay-werktitel" id="bildOverlayWerktitel"></p>
    </div>

    <div class="bild-overlay-bildbereich" id="bildOverlayBildbereich">
      <img id="bildOverlayFoto" src="" alt="">
    </div>

    <div class="bild-overlay-fusszeile">
      <p class="bild-overlay-projekttitel">usa</p>
      <button class="bild-overlay-schliessen" id="bildOverlaySchliessen" type="button">
        back
      </button>
    </div>

  </div>

  <script>
    const bilderReihe = document.querySelector(".bilder");
    const projektBilder = Array.from(bilderReihe.querySelectorAll("img"));

    const overlay = document.getElementById("bildOverlay");
    const overlayFoto = document.getElementById("bildOverlayFoto");
    const overlayZaehler = document.getElementById("bildOverlayZaehler");
    const overlayWerktitel = document.getElementById("bildOverlayWerktitel");
    const overlayBildbereich = document.getElementById("bildOverlayBildbereich");
    const overlaySchliessen = document.getElementById("bildOverlaySchliessen");

    let aktuellerIndex = 0;
    let touchStartX = null;

    function zeigeBild(index) {
      aktuellerIndex = (index + projektBilder.length) % projektBilder.length;

      const bild = projektBilder[aktuellerIndex];

      overlayFoto.src = bild.src;
      overlayFoto.alt = bild.alt;
      overlayZaehler.textContent = `${aktuellerIndex + 1}/${projektBilder.length}`;
      overlayWerktitel.textContent = bild.alt;

      aktualisiereOverlayBreite();
    }

    // Nummerierung und Werktitel für jedes Bild erstellen
    projektBilder.forEach((bild, index) => {
      const nummer = index + 1;

      const bildContainer = document.createElement("div");
      bildContainer.className = "bild";

      bild.before(bildContainer);
      bildContainer.appendChild(bild);

      const bildInfo = document.createElement("div");
      bildInfo.className = "bild-info";

      const bildNummer = document.createElement("span");
      bildNummer.textContent = `${nummer}/${projektBilder.length}`;

      const bildTitel = document.createElement("span");
      bildTitel.className = "bild-info-titel";
      bildTitel.textContent = bild.alt;

      bildInfo.appendChild(bildNummer);
      bildInfo.appendChild(bildTitel);
      bildContainer.appendChild(bildInfo);

      // Vollbildmodus öffnen
      bild.addEventListener("click", () => {
        zeigeBild(index);

        overlay.classList.add("aktiv");
        overlay.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";

        aktualisiereOverlayBreite();
      });
    });

    // Vertikales Mausrad in horizontales Scrollen umwandeln
    bilderReihe.addEventListener("wheel", (event) => {
      if (!event.ctrlKey && Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
        event.preventDefault();
        bilderReihe.scrollLeft += event.deltaY;
      }
    }, {
      passive: false
    });

    // Texte an der Bildbreite ausrichten
    function aktualisiereOverlayBreite() {
      if (!overlay.classList.contains("aktiv")) {
        return;
      }

      const bildbreite = overlayFoto.getBoundingClientRect().width;

      if (bildbreite > 0) {
        overlay.style.setProperty("--overlay-bildbreite", `${bildbreite}px`);
      }
    }

    overlayFoto.addEventListener("load", aktualisiereOverlayBreite);
    window.addEventListener("resize", aktualisiereOverlayBreite);

    // Klick auf das Bild schließt die Vorschau.
    // Klick links oder rechts neben dem Bild wechselt das Bild.
    overlayBildbereich.addEventListener("click", (event) => {
      if (event.target === overlayFoto) {
        schliesseOverlay();
        return;
      }

      const bildRechteck = overlayFoto.getBoundingClientRect();

      if (event.clientX < bildRechteck.left) {
        zeigeBild(aktuellerIndex - 1);
      } else if (event.clientX > bildRechteck.right) {
        zeigeBild(aktuellerIndex + 1);
      }
    });

    // Wischen auf dem Handy wechselt das Bild
    overlayBildbereich.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, {
      passive: true
    });

    overlayBildbereich.addEventListener("touchend", (event) => {
      if (touchStartX === null) {
        return;
      }

      const touchEndX = event.changedTouches[0].clientX;
      const swipeAbstand = touchEndX - touchStartX;

      if (Math.abs(swipeAbstand) > 50) {
        zeigeBild(swipeAbstand < 0 ? aktuellerIndex + 1 : aktuellerIndex - 1);
      }

      touchStartX = null;
    }, {
      passive: true
    });

    // Vollbildmodus schließen
    function schliesseOverlay() {
      overlay.classList.remove("aktiv");
      overlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    overlaySchliessen.addEventListener("click", schliesseOverlay);

    document.addEventListener("keydown", (event) => {
      if (!overlay.classList.contains("aktiv")) {
        return;
      }

      if (event.key === "Escape") {
        schliesseOverlay();
      } else if (event.key === "ArrowLeft") {
        zeigeBild(aktuellerIndex - 1);
      } else if (event.key === "ArrowRight") {
        zeigeBild(aktuellerIndex + 1);
      }
    });
  </script>

</body>
</html>
