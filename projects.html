<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>projects — fabianwachter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px clamp(16px, 3vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111111;
      font-family: "Avenir Medium", Avenir, "Avenir Next", sans-serif;
      font-size: 16px;
      font-weight: 500;
    }

    .container {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: calc(100vh - 48px);
      min-width: 0;
    }

    .navigation {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin: 0;
      padding: 0;
    }

    .seitentitel,
    .shuffle,
    .zurueck {
      margin: 0;
      padding: 0;
      color: inherit;
      font: inherit;
      line-height: 1.4;
      text-decoration: none;
    }

    .shuffle {
      border: 0;
      background: none;
      cursor: pointer;
    }

    .projekte {
      display: flex;
      flex: 1 1 auto;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .projekte::-webkit-scrollbar {
      display: none;
    }

    .projekt {
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      color: inherit;
      text-decoration: none;
    }

    .projekt img {
      display: block;
      width: auto;
      height: min(500px, 65vh);
      object-fit: contain;
    }

    .projekttitel {
      margin: 8px 0 0;
      padding: 0;
      color: inherit;
      font: inherit;
      line-height: 1.4;
      text-align: left;
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      gap: 24px;
      padding: 14px 0 0;
    }

    @media (max-width: 600px) {
      .projekt img {
        height: min(380px, 55vh);
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="navigation">
      <p class="seitentitel">projects</p>
      <button class="shuffle" id="shuffle-button" type="button">
        shuffle
      </button>
    </header>

    <div class="projekte" aria-label="Projekte">
      <a class="projekt" href="./iceland.html" data-project="iceland">
        <img alt="Iceland">
        <p class="projekttitel">iceland</p>
      </a>

      <a class="projekt" href="./paris.html" data-project="paris">
        <img alt="Paris">
        <p class="projekttitel">paris</p>
      </a>

      <a class="projekt" href="./usa.html" data-project="usa">
        <img alt="USA">
        <p class="projekttitel">usa</p>
      </a>

      <a class="projekt" href="./berlin.html" data-project="berlin">
        <img alt="Berlin">
        <p class="projekttitel">berlin</p>
      </a>

      <a class="projekt" href="./indonesia.html" data-project="indonesia">
        <img alt="Indonesia">
        <p class="projekttitel">indonesia</p>
      </a>
    </div>

    <footer class="footer">
      <a class="zurueck" href="./index.html#website">back</a>
    </footer>
  </main>

  <script>
    const projekte = Array.from(
      document.querySelectorAll(".projekt[data-project]")
    );

    const aktuelleCover = new Map();

    function mische(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }

      return array;
    }

    function ladeZufaelligesCover(projekt, neuesCover = false) {
      const name = projekt.dataset.project;
      const img = projekt.querySelector("img");

      let nummern = Array.from({ length: 21 }, (_, index) => index + 1)
        .filter((nummer) => !(name === "iceland" && nummer === 10));

      if (neuesCover && aktuelleCover.has(name) && nummern.length > 1) {
        nummern = nummern.filter(
          (nummer) => nummer !== aktuelleCover.get(name)
        );
      }

      mische(nummern);

      function ladeNaechstesBild() {
        const nummer = nummern.pop();

        if (nummer === undefined) return;

        const bild = new Image();

        bild.onload = () => {
          img.src = bild.src;
          aktuelleCover.set(name, nummer);
        };

        bild.onerror = ladeNaechstesBild;
        bild.src = `./images/${name}-${nummer}.jpg`;
      }

      ladeNaechstesBild();
    }

    function shuffleCovers() {
      projekte.forEach((projekt) => {
        ladeZufaelligesCover(projekt, true);
      });
    }

    projekte.forEach((projekt) => {
      ladeZufaelligesCover(projekt);
    });

    document
      .getElementById("shuffle-button")
      .addEventListener("click", shuffleCovers);

    // Vertikales Mausrad in horizontales Scrollen umwandeln
    const projektReihe = document.querySelector(".projekte");

    projektReihe.addEventListener("wheel", (event) => {
      if (!event.ctrlKey && Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
        event.preventDefault();
        projektReihe.scrollLeft += event.deltaY;
      }
    }, {
      passive: false
    });
  </script>
</body>
</html>
