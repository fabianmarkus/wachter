
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>projects — fabianwachter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111111;
      font-family: "Avenir Medium", Avenir, "Avenir Next", sans-serif;
      font-weight: 500;
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    .projekte {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 48px 12px;
      align-items: start;
    }

    .projekt img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .projekttitel {
      margin: 14px 0 0;
      font-size: 32px;
      text-align: left;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: inherit;
      text-decoration: none;
    }

    .zurueck {
      grid-column: 3;
      justify-self: end;
      align-self: end;
      font-size: 16px;
      padding-bottom: 4px;
    }

    @media (max-width: 600px) {
      .projekte {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .zurueck {
        grid-column: 2;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="projekte">

      <!-- Projekt 01: Iceland -->

      <a class="projekt" href="./iceland.html">
        <img src="./images/cover-5.jpg" alt="Iceland">
        <p class="projekttitel">iceland</p>
      </a>

      <!-- Weitere Projekte später hier ergänzen -->

      <a class="zurueck" href="./index.html#website">back</a>

    </div>

  </main>

</body>
</html>
