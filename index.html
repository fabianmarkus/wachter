
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fabianwachter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111111;
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    .bilder {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .bilder img {
      display: block;
      width: calc((100% - 12px) / 2);
      height: auto;
      min-width: 0;
      object-fit: contain;
    }

    p {
      margin: 14px 0 0;
      font-family: "Avenir Medium", Avenir, "Avenir Next", sans-serif;
      font-size: 16px;
      font-weight: 500;
      text-align: left;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: inherit;
      text-decoration: none;
    }

    /* Name und Kontaktdaten */

    .name {
      font-size: 22px;
    }

    .kontakt {
      margin-top: 48px;
      font-size: 16px;
    }

    /* Landingpage */

    .cover {
      width: 50%;
      max-width: 500px;
      cursor: pointer;
      padding: 0;
      border: 0;
      background: none;
    }

    .cover img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- Landingpage -->

  <button class="cover" id="landingpage"
          type="button" aria-label="Website öffnen"
          onclick="openWebsite()">
    <img id="coverbild" alt="Cover">
  </button>

  <!-- Bestehende Website -->

  <main class="container" id="website" hidden>
    <div class="bilder">
      <img src="./images/foto-1.jpg" alt="photo 1">
      <img src="./images/foto-2.jpg" alt="photo 2">
    </div>

    <p class="name">
      <a href="https://www.instagram.com/fabian.markus/"
         target="_blank" rel="noopener noreferrer">fabian wachter</a>
    </p>

    <p class="kontakt">
      viktoria-luise-platz 3<br>
      10777 berlin<br>
      <a href="tel:+491741870290">00491741870290</a><br>
      <a href="mailto:mail@fabianwachter.de">mail@fabianwachter.de</a>
    </p>

  </main>

  <script>
    // Zufälliges Coverbild auswählen
    const zufallszahl = Math.floor(Math.random() * 5) + 1;

    document.getElementById("coverbild").src =
      "./images/cover-" + zufallszahl + ".jpg";

    // Bestehende Website öffnen
    function openWebsite() {
      document.getElementById("landingpage").hidden = true;
      document.getElementById("website").hidden = false;
    }
  </script>

</body>
</html>
