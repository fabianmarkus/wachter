
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fabianwachter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111111;
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    .bilder {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .bilder img {
      display: block;
      width: calc((100% - 12px) / 2);
      height: auto;
      min-width: 0;
      object-fit: contain;
    }

    p {
      margin: 14px 0 0;
      font-family: "Avenir Medium", Avenir, "Avenir Next", sans-serif;
      font-size: 16px;
      font-weight: 500;
      text-align: left;
    }
    a {
  color: inherit;
  text-decoration: none;
}

a:hover {
  color: inherit;
  text-decoration: none;
}
  </style>
</head>

<body>

  <main class="container">
    <div class="bilder">
      <img src="./images/foto-1.jpg" alt="photo 1">
      <img src="./images/foto-2.jpg" alt="photo 2">
    </div>

    <p>
  <a href="https://www.instagram.com/fabian.markus/"
     target="_blank" rel="noopener noreferrer">fabian wachter</a>
</p>

</body>
</html>
