<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fabianwachter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px clamp(16px, 3vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111111;
    }

    .container {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: calc(100vh - 48px);
    }

    .bilder {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      width: 100%;
    }

    .bilder img {
      display: block;
      width: calc((100% - 12px) / 2);
      height: auto;
      min-width: 0;
      object-fit: contain;
    }

    p {
      margin: 14px 0 0;
      font-family: "Avenir Medium", Avenir, "Avenir Next", sans-serif;
      font-size: 16px;
      font-weight: 500;
      text-align: left;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: inherit;
      text-decoration: none;
    }

    /* Name */

    .titelzeile {
      margin-top: auto;
      padding-top: 14px;
    }

    .name {
      margin: 0;
      font-size: 32px;
    }

    /* Adresse und Navigation */

    .kontaktbereich {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-top: 14px;
    }

    .kontakt {
      margin: 0;
      font-size: 16px;
    }

    .navigation {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 32px;
      margin: 0;
      font-family: "Avenir Medium", Avenir, "Avenir Next", sans-serif;
      font-size: 16px;
      font-weight: 500;
    }

    /* Landingpage */

    .cover {
      width: 50%;
      max-width: 500px;
      cursor: pointer;
      padding: 0;
      border: 0;
      background: none;
    }

    .cover img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- Landingpage mit festem Deckblatt -->

  <button class="cover" id="landingpage"
          type="button" aria-label="Website öffnen"
          onclick="openWebsite()">
    <img src="./images/deckblatt.png" alt="Deckblatt">
  </button>

  <!-- Bestehende Website -->

  <main class="container" id="website" hidden>

    <div class="bilder">
      <img src="./images/foto-1.jpg" alt="photo 1">
      <img src="./images/foto-2.jpg" alt="photo 2">
    </div>

    <div class="titelzeile">
      <p class="name">
        <a href="https://www.instagram.com/fabian.markus/"
           target="_blank" rel="noopener noreferrer">fabian wachter</a>
      </p>
    </div>

    <div class="kontaktbereich">
      <p class="kontakt">
        viktoria-luise-platz 3<br>
        10777 berlin<br>
        <a href="tel:+491741870290">00491741870290</a><br>
        <a href="mailto:mail@fabianwachter.de">mail@fabianwachter.de</a>
      </p>

      <nav class="navigation" aria-label="Navigation">
        <a href="./projects.html">projects</a>
        <a href="./pdf/portfolio.pdf"
           target="_blank" rel="noopener noreferrer">portfolio</a>
        <a href="./pdf/cv.pdf"
           target="_blank" rel="noopener noreferrer">cv</a>
      </nav>
    </div>

  </main>

  <script>
    // Bestehende Website öffnen
    function openWebsite() {
      document.getElementById("landingpage").hidden = true;
      document.getElementById("website").hidden = false;
    }

    // Bei Rückkehr von der Projektübersicht
    // das Deckblatt überspringen
    if (window.location.hash === "#website") {
      openWebsite();
    }
  </script>

</body>
</html>
