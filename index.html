<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fabian Wachter</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
    }

    img {
      display: block;
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
    }

    p {
      margin: 0;
      font-family: "Avenir Medium", Avenir, "Avenir Next", sans-serif;
      font-size: 18px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <img id="foto" alt="">
  <p>fabian wachter</p>

  <script>
    const fotos = [
      "foto-1.jpg",
      "foto-2.jpg",
      "foto-3.jpg",
      "foto-4.jpg",
      "foto-5.jpg"
    ];

    document.getElementById("foto").src =
      fotos[Math.floor(Math.random() * fotos.length)];
  </script>
</body>
</html>
