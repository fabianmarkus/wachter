
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fabianwachter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px clamp(16px, 3vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111111;
      font-family: "Avenir Medium", Avenir, "Avenir Next", sans-serif;
      font-size: 16px;
      font-weight: 500;
    }

    .container {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: calc(100vh - 48px);
    }

    .navigation {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      gap: 32px;
      margin: 0;
      padding: 0;
    }

    .navigation a,
    .navigation button,
    .shuffle {
      color: inherit;
      font: inherit;
      text-decoration: none;
    }

    .navigation a:hover,
    .navigation button:hover,
    .shuffle:hover {
      text-decoration: none;
    }

    .navigation button {
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
    }

    .projects-menu {
      position: relative;
    }

    .submenu {
      position: absolute;
      top: 100%;
      left: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 8px;
      white-space: nowrap;
    }

    .bilder {
      display: flex;
      flex: 1 1 auto;
      gap: 12px;
      align-items: center;
      width: 100%;
      min-height: 0;
    }

    .bilder img {
      display: block;
      width: calc((100% - 12px) / 2);
      max-height: 100%;
      height: auto;
      min-width: 0;
      object-fit: contain;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      padding: 14px 0 0;
    }

    .person {
      min-width: 0;
    }

    .name {
      margin: 0 0 14px;
      font-size: 32px;
      font-weight: 500;
      line-height: 1.2;
    }

    .name a,
    .kontakt a {
      color: inherit;
      text-decoration: none;
    }

    .kontakt {
      margin: 0;
      line-height: 1.4;
    }

    .shuffle {
      flex: 0 0 auto;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
    }

    /* Landingpage mit Deckblatt */

    .cover {
      width: 50%;
      max-width: 500px;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
    }

    .cover img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      .navigation {
        gap: 20px;
      }

      .bilder {
        gap: 8px;
      }

      .bilder img {
        width: calc((100% - 8px) / 2);
      }

      .footer {
        gap: 16px;
      }

      .name {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <!-- Deckblatt: Anklicken, um die Website zu öffnen -->
  <button
    class="cover"
    id="landingpage"
    type="button"
    aria-label="Website öffnen"
    onclick="openWebsite()"
  >
    <img src="./images/deckblatt.png" alt="Deckblatt">
  </button>

  <!-- Website -->
  <main class="container" id="website" hidden>

    <nav class="navigation" aria-label="Navigation">
      <div class="projects-menu">
        <button
          id="projects-button"
          type="button"
          aria-expanded="false"
          aria-controls="projects-submenu"
          onclick="toggleProjects()"
        >
          projects
        </button>

        <div class="submenu" id="projects-submenu" hidden>
          <a href="./commission.html">commission</a>
          <a href="./projects.html">personal</a>
        </div>
      </div>

      <a href="./pdf/portfolio.pdf" target="_blank" rel="noopener noreferrer">
        portfolio
      </a>

      <a href="./pdf/cv.pdf" target="_blank" rel="noopener noreferrer">
        cv
      </a>
    </nav>

    <!-- Zufällig ausgewähltes Bildpaar -->
    <section class="bilder" aria-label="Fotos">
      <img id="foto-1" alt="photo 1">
      <img id="foto-2" alt="photo 2">
    </section>

    <footer class="footer">
      <div class="person">
        <h1 class="name">
          <a
            href="https://www.instagram.com/fabian.markus/"
            target="_blank"
            rel="noopener noreferrer"
          >fabian wachter</a>
        </h1>

        <p class="kontakt">
          <a href="tel:+491741870290">00491741870290</a><br>
          <a href="mailto:mail@fabianwachter.de">mail@fabianwachter.de</a>
        </p>
      </div>

      <button class="shuffle" type="button" onclick="shufflePhotos()">
        shuffle
      </button>
    </footer>

  </main>

  <script>
    // Website öffnen
    function openWebsite() {
      document.getElementById("landingpage").hidden = true;
      document.getElementById("website").hidden = false;
    }

    // Projects-Untermenü öffnen und schließen
    function toggleProjects() {
      const button = document.getElementById("projects-button");
      const submenu = document.getElementById("projects-submenu");
      const isOpen = button.getAttribute("aria-expanded") === "true";

      button.setAttribute("aria-expanded", String(!isOpen));
      submenu.hidden = isOpen;
    }

    // Anzahl der vorhandenen Bildpaare
    const anzahlBildpaare = 10;

    // Bildpaare automatisch anhand der Dateinamen erstellen
    const bildpaare = Array.from(
      { length: anzahlBildpaare },
      (_, index) => [
        `./images/foto-${index + 1}.1.JPG`,
        `./images/foto-${index + 1}.2.JPG`
      ]
    );

    // Zuletzt angezeigtes Bildpaar
    let aktuellesPaar = -1;

    // Letztes Bildpaar aus dem Browserspeicher abrufen
    try {
      const gespeichert = localStorage.getItem("letztesBildpaar");

      if (gespeichert !== null) {
        aktuellesPaar = Number(gespeichert);
      }
    } catch (error) {
      // Funktioniert auch ohne Browserspeicher
    }

    // Zufälliges neues Bildpaar auswählen
    function shufflePhotos() {
      let neuesPaar;

      do {
        neuesPaar = Math.floor(Math.random() * bildpaare.length);
      } while (
        neuesPaar === aktuellesPaar &&
        bildpaare.length > 1
      );

      aktuellesPaar = neuesPaar;

      // Linkes und rechtes Foto aktualisieren
      document.getElementById("foto-1").src =
        bildpaare[aktuellesPaar][0];

      document.getElementById("foto-2").src =
        bildpaare[aktuellesPaar][1];

      // Angezeigtes Bildpaar speichern
      try {
        localStorage.setItem("letztesBildpaar", aktuellesPaar);
      } catch (error) {
        // Funktioniert auch ohne Browserspeicher
      }
    }

    // Beim Laden der Website ein zufälliges Bildpaar auswählen
    shufflePhotos();

    // Bei Rückkehr von der Projektübersicht
    // das Deckblatt überspringen
    if (window.location.hash === "#website") {
      openWebsite();
    }
  </script>

</body>
</html>
