
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iceland — fabianwachter</title>

  <style>
    * {
      box-sizing: border-box;
      cursor: default !important;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px clamp(16px, 3vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111111;
      font-family: "Avenir Medium", Avenir, "Avenir Next", sans-serif;
      font-weight: 500;
    }

    .container {
      width: 100%;
    }

    .bilder {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .bilder::-webkit-scrollbar {
      display: none;
    }

    .bild {
      position: relative;
      flex: 0 0 auto;
      padding-top: calc(1.2em + 10px);
    }

    .bild-info {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: flex-start;
      align-items: baseline;
      gap: 0.3em;
      font-size: 16px;
      line-height: 1.2;
      visibility: hidden;
      pointer-events: none;
    }

    .bild-info-titel {
      text-align: left;
    }

    @media (hover: hover) {
      .bild img:hover + .bild-info {
        visibility: visible;
      }
    }

    .bilder img {
      display: block;
      flex: 0 0 auto;
      width: auto;
      height: 500px;
      object-fit: contain;
    }

    .titelzeile {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 14px;
    }

    .projekttitel {
      margin: 0;
      font-size: 32px;
    }

    .zurueck {
      font-size: 16px;
      color: inherit;
      text-decoration: none;
    }

    .zurueck:hover {
      color: inherit;
      text-decoration: none;
    }

    .bild-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      flex-direction: column;
      padding: 24px clamp(16px, 3vw, 40px);
      background: rgba(0, 0, 0, 0.92);
      color: #ffffff;
    }

    .bild-overlay.aktiv {
      display: flex;
    }

    .bild-overlay-zaehler {
      flex: 0 0 auto;
      align-self: center;
      width: var(--overlay-bildbreite, 100%);
      margin: 0;
      font-size: 16px;
    }

    .bild-overlay-bildbereich {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .bild-overlay-bildbereich img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .bild-overlay-fusszeile {
      display: flex;
      flex: 0 0 auto;
      align-self: center;
      width: var(--overlay-bildbreite, 100%);
      justify-content: space-between;
      align-items: baseline;
      gap: 24px;
    }

    .bild-overlay-projekttitel {
      margin: 0;
      font-size: 32px;
    }

    .bild-overlay-werktitel {
      margin: 0;
      font-size: 16px;
      text-align: right;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="bilder">
      <img src="./images/iceland-1.jpg" alt="Iceland 1">
      <img src="./images/iceland-2.jpg" alt="Iceland 2">
      <img src="./images/iceland-3.jpg" alt="Iceland 3">
      <img src="./images/iceland-4.jpg" alt="Iceland 4">
      <img src="./images/iceland-5.jpg" alt="Iceland 5">
      <img src="./images/iceland-6.jpg" alt="Iceland 6">
      <img src="./images/iceland-7.jpg" alt="Iceland 7">
      <img src="./images/iceland-8.jpg" alt="Iceland 8">
      <img src="./images/iceland-9.jpg" alt="Iceland 9">
      <img src="./images/iceland-10.jpg" alt="Iceland 10">
      <img src="./images/iceland-11.jpg" alt="Iceland 11">
      <img src="./images/iceland-12.jpg" alt="Iceland 12">
      <img src="./images/iceland-13.jpg" alt="Iceland 13">
      <img src="./images/iceland-14.jpg" alt="Iceland 14">
      <img src="./images/iceland-15.jpg" alt="Iceland 15">
      <img src="./images/iceland-16.jpg" alt="Iceland 16">
      <img src="./images/iceland-17.jpg" alt="Iceland 17">
      <img src="./images/iceland-18.jpg" alt="Iceland 18">
      <img src="./images/iceland-19.jpg" alt="Iceland 19">
      <img src="./images/iceland-20.jpg" alt="Iceland 20">
      <img src="./images/iceland-21.jpg" alt="Iceland 21">
    </div>

    <div class="titelzeile">
      <p class="projekttitel">iceland</p>
      <a class="zurueck" href="./projects.html">back</a>
    </div>

  </main>

  <div class="bild-overlay" id="bildOverlay" aria-hidden="true">

    <p class="bild-overlay-zaehler" id="bildOverlayZaehler"></p>

    <div class="bild-overlay-bildbereich">
      <img id="bildOverlayFoto" src="" alt="">
    </div>

    <div class="bild-overlay-fusszeile">
      <p class="bild-overlay-projekttitel">iceland</p>
      <p class="bild-overlay-werktitel" id="bildOverlayWerktitel"></p>
    </div>

  </div>

  <script>
    const bilderReihe = document.querySelector(".bilder");
    const projektBilder = Array.from(bilderReihe.querySelectorAll("img"));

    const overlay = document.getElementById("bildOverlay");
    const overlayFoto = document.getElementById("bildOverlayFoto");
    const overlayZaehler = document.getElementById("bildOverlayZaehler");
    const overlayWerktitel = document.getElementById("bildOverlayWerktitel");

    // Nummerierung und Werktitel für jedes Bild erstellen

    projektBilder.forEach((bild, index) => {
      const nummer = index + 1;

      const bildContainer = document.createElement("div");
      bildContainer.className = "bild";

      bild.before(bildContainer);
      bildContainer.appendChild(bild);

      const bildInfo = document.createElement("div");
      bildInfo.className = "bild-info";

      const bildNummer = document.createElement("span");
      bildNummer.textContent = `${nummer}/${projektBilder.length}`;

      const bildTitel = document.createElement("span");
      bildTitel.className = "bild-info-titel";
      bildTitel.textContent = bild.alt;

      bildInfo.appendChild(bildNummer);
      bildInfo.appendChild(bildTitel);

      bildContainer.appendChild(bildInfo);

      // Vollbildmodus öffnen

      bild.addEventListener("click", () => {
        overlayFoto.src = bild.src;
        overlayFoto.alt = bild.alt;

        overlayZaehler.textContent = `${nummer}/${projektBilder.length}`;
        overlayWerktitel.textContent = bild.alt;

        overlay.classList.add("aktiv");
        overlay.setAttribute("aria-hidden", "false");

        document.body.style.overflow = "hidden";

        aktualisiereOverlayBreite();
      });
    });

    // Vertikales Mausrad in horizontales Scrollen umwandeln

    bilderReihe.addEventListener("wheel", (event) => {
      if (!event.ctrlKey && Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
        event.preventDefault();
        bilderReihe.scrollLeft += event.deltaY;
      }
    }, {
      passive: false
    });

    // Texte im Vollbildmodus an den Bildkanten ausrichten

    function aktualisiereOverlayBreite() {
      if (!overlay.classList.contains("aktiv")) {
        return;
      }

      const bildbreite = overlayFoto.getBoundingClientRect().width;

      if (bildbreite > 0) {
        overlay.style.setProperty(
          "--overlay-bildbreite",
          `${bildbreite}px`
        );
      }
    }

    overlayFoto.addEventListener("load", aktualisiereOverlayBreite);

    window.addEventListener("resize", aktualisiereOverlayBreite);

    // Vollbildmodus schließen

    function schliesseOverlay() {
      overlay.classList.remove("aktiv");
      overlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    overlay.addEventListener("click", schliesseOverlay);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && overlay.classList.contains("aktiv")) {
        schliesseOverlay();
      }
    });
  </script>

</body>
</html>
