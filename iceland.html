<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iceland — fabianwachter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111111;
      font-family: "Avenir Medium", Avenir, "Avenir Next", sans-serif;
      font-weight: 500;
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    .bilder {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .bilder::-webkit-scrollbar {
      display: none;
    }

    .bilder img {
      display: block;
      flex: 0 0 auto;
      width: auto;
      height: 500px;
      object-fit: contain;
      cursor: zoom-in;
    }

    .titelzeile {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 14px;
    }

    .projekttitel {
      margin: 0;
      font-size: 32px;
    }

    .zurueck {
      font-size: 16px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: inherit;
      text-decoration: none;
    }

    .bild-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.92);
      cursor: zoom-out;
    }

    .bild-overlay.aktiv {
      display: flex;
    }

    .bild-overlay img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="bilder">
      <img src="./images/iceland-1.jpg" alt="Iceland 1">
      <img src="./images/iceland-2.jpg" alt="Iceland 2">
      <img src="./images/iceland-3.jpg" alt="Iceland 3">
      <img src="./images/iceland-4.jpg" alt="Iceland 4">
      <img src="./images/iceland-5.jpg" alt="Iceland 5">
      <img src="./images/iceland-6.jpg" alt="Iceland 6">
      <img src="./images/iceland-7.jpg" alt="Iceland 7">
      <img src="./images/iceland-8.jpg" alt="Iceland 8">
      <img src="./images/iceland-9.jpg" alt="Iceland 9">
      <img src="./images/iceland-10.jpg" alt="Iceland 10">
      <img src="./images/iceland-11.jpg" alt="Iceland 11">
      <img src="./images/iceland-12.jpg" alt="Iceland 12">
      <img src="./images/iceland-13.jpg" alt="Iceland 13">
      <img src="./images/iceland-14.jpg" alt="Iceland 14">
      <img src="./images/iceland-15.jpg" alt="Iceland 15">
      <img src="./images/iceland-16.jpg" alt="Iceland 16">
      <img src="./images/iceland-17.jpg" alt="Iceland 17">
      <img src="./images/iceland-18.jpg" alt="Iceland 18">
      <img src="./images/iceland-19.jpg" alt="Iceland 19">
      <img src="./images/iceland-20.jpg" alt="Iceland 20">
      <img src="./images/iceland-21.jpg" alt="Iceland 21">
    </div>

    <div class="titelzeile">
      <p class="projekttitel">iceland</p>
      <a class="zurueck" href="./projects.html">back</a>
    </div>

  </main>

  <div class="bild-overlay" id="bildOverlay" aria-hidden="true">
    <img id="bildOverlayFoto" src="" alt="">
  </div>

  <script>
    const overlay = document.getElementById("bildOverlay");
    const overlayFoto = document.getElementById("bildOverlayFoto");

    document.querySelectorAll(".bilder img").forEach((bild) => {
      bild.addEventListener("click", () => {
        overlayFoto.src = bild.src;
        overlayFoto.alt = bild.alt;
        overlay.classList.add("aktiv");
        overlay.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      });
    });

    function schliesseOverlay() {
      overlay.classList.remove("aktiv");
      overlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    overlay.addEventListener("click", schliesseOverlay);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && overlay.classList.contains("aktiv")) {
        schliesseOverlay();
      }
    });
  </script>

</body>
</html>
