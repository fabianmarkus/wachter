
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iceland — fabianwachter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111111;
      font-family: "Avenir Medium", Avenir, "Avenir Next", sans-serif;
      font-weight: 500;
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    .bilder {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      align-items: start;
    }

    .bilder img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .titelzeile {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 14px;
    }

    .projekttitel {
      margin: 0;
      font-size: 32px;
    }

    .zurueck {
      font-size: 16px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: inherit;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="bilder">
      <img src="./images/cover-1.jpg" alt="Iceland 1">
      <img src="./images/cover-2.jpg" alt="Iceland 2">
      <img src="./images/cover-3.jpg" alt="Iceland 3">
      <img src="./images/cover-4.jpg" alt="Iceland 4">
      <img src="./images/cover-5.jpg" alt="Iceland 5">
    </div>

    <div class="titelzeile">
      <p class="projekttitel">iceland</p>
      <a class="zurueck" href="./projects.html">back</a>
    </div>

  </main>

</body>
</html>
